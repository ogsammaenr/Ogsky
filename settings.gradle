pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

// Should match your modid
rootProject.name = 'ogsky'

include 'modules:core'
include 'modules:panel'
include 'modules:level'
include 'modules:limits'
include 'modules:warps'
